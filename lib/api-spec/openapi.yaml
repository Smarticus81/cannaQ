          type: integer
        complaintNumber:
          type: string
        complaintType:
          type: string
        severity:
          type: string
        status:
          type: string
      required:
        - id
        - complaintNumber
        - complaintType
        - severity
        - status

    # Full GET /capas/{id} payload — extends Capa with the joined sub-rows.
    CapaDetail:
      allOf:
        - $ref: "#/components/schemas/Capa"
        - type: object
          properties:
            actionItems:
              type: array
              items:
                $ref: "#/components/schemas/CapaActionItem"
            sourceNc:
              oneOf:
                - $ref: "#/components/schemas/CapaSourceNcRef"
                - type: "null"
            sourceComplaint:
              oneOf:
                - $ref: "#/components/schemas/CapaSourceComplaintRef"
                - type: "null"
          required:
            - actionItems

    # Whitelisted fields on POST /capas (server overlays openedBy / originator /
    # capaNumber / stage=Initiation / status=Open).
    CreateCapaBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          description: "Corrective | Preventive (defaults Corrective)"
        sourceNcId:
          type: ["integer", "null"]
        sourceComplaintId:
          type: ["integer", "null"]
        rootCauseAnalysis:
          type: ["string", "null"]
        rcaMethod:
          type: ["string", "null"]
        effectivenessCriteria:
          type: ["string", "null"]
        effectivenessCheckDue:
          type: ["string", "null"]
          format: date
        productType:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]
        lotNumber:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        rootCauses:
          type: ["array", "null"]
          items:
            type: string
        investigationDueDate:
          type: ["string", "null"]
          format: date
        actionPlanningDueDate:
          type: ["string", "null"]
          format: date
        ecPlanningDueDate:
          type: ["string", "null"]
          format: date
        # ── Session 34 (Tier 2 #10) — initial Risk classification ───────
        # Server requires riskLevel + a non-empty riskRationale at open.
        # The five booleans are optional guidance; operator's tier choice
        # stays authoritative.
        riskLevel:
          type: string
          description: "Critical | High | Medium | Low"
        riskRationale:
          type: string
          description: "Required when riskLevel is set. Documents WHY this tier was chosen."
        riskReleased:
          type: ["boolean", "null"]
        riskCustomerAffected:
          type: ["boolean", "null"]
        riskLabelingImpact:
          type: ["boolean", "null"]
        riskInHouseOnly:
          type: ["boolean", "null"]
        riskPreBulk:
          type: ["boolean", "null"]
      required:
        - title
        - description
        - riskLevel
        - riskRationale

    # PATCH /capas/{id} — strict whitelist (see CAPA_PATCH_ALLOWED in capas.ts).
    # Lifecycle / signature fields must use the workflow endpoints.
    UpdateCapaBody:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        description:
          type: string
        rootCauseAnalysis:
          type: ["string", "null"]
        rcaMethod:
          type: ["string", "null"]
        rcaMethods:
          type: ["array", "null"]
          items:
            type: string
        effectivenessCriteria:
          type: ["string", "null"]
        effectivenessCheckDue:
          type: ["string", "null"]
          format: date
        originatorId:
          type: ["integer", "null"]
        originatorName:
          type: ["string", "null"]
        effectivenessOwnerId:
          type: ["integer", "null"]
        effectivenessOwnerName:
          type: ["string", "null"]
        productType:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]
        lotNumber:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        rootCauses:
          type: ["array", "null"]
          items:
            type: string
        investigationDueDate:
          type: ["string", "null"]
          format: date
        actionPlanningDueDate:
          type: ["string", "null"]
          format: date
        ecPlanningDueDate:
          type: ["string", "null"]
          format: date
        # ── Session 34 (Tier 2 #10) — Risk revision in Investigation ────
        # Any change to riskLevel must come with a riskRevisedReason in the
        # same PATCH body. Server stamps the riskRevisedAt / riskRevisedByName
        # / riskRevisedFrom lineage; the client cannot spoof them.
        riskLevel:
          type: ["string", "null"]
          description: "Critical | High | Medium | Low"
        riskRationale:
          type: ["string", "null"]
        riskReleased:
          type: ["boolean", "null"]
        riskCustomerAffected:
          type: ["boolean", "null"]
        riskLabelingImpact:
          type: ["boolean", "null"]
        riskInHouseOnly:
          type: ["boolean", "null"]
        riskPreBulk:
          type: ["boolean", "null"]
        riskRevisedReason:
          type: ["string", "null"]
          description: "Required when riskLevel is changing on an existing CAPA."

    # Session 35 — Gate 0 acceptance body. Single signer, Manager/Quality/Admin.
    Gate0ApproveBody:
