        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierBody"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierBody"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suppliers/{id}/reopen:
    post:
      operationId: reopenSupplier
      tags: [suppliers]
      summary: Reopen an Approved supplier for revision (Session 32 — Tier 1 #4)
      description: |
        Approved suppliers are frozen — every other field is read-only and `PATCH /suppliers/{id}`
        returns 409. This endpoint flips status from "Approved" to "Pending Review" so the
        operator can then edit the record through the normal PATCH. A reason is required and
        is captured to the audit trail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenSupplierBody"
      responses:
        "200":
          description: Supplier reopened (status flipped to Pending Review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: Reason missing or empty
        "401":
          description: Authentication required
        "404":
          description: Supplier not found
        "409":
          description: Supplier is not currently Approved (already editable)

  /suppliers/{id}/risk-history:
    get:
      operationId: getSupplierRiskHistory
      tags: [suppliers]
      summary: Monthly risk score history for a supplier (last 13 months)
      parameters:
