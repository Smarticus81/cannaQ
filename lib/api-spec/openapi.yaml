      tags: [capas]
      summary: List all CAPAs
      responses:
        "200":
          description: CAPAs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capa"
    post:
      operationId: createCapa
      tags: [capas]
      summary: Open a new CAPA (originator = current user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapaBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}:
    get:
      operationId: getCapa
      tags: [capas]
      summary: Get a CAPA with its action items and source links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CAPA detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaDetail"
    patch:
      operationId: updateCapa
      tags: [capas]
      summary: Update safe metadata (lifecycle fields go through workflow endpoints)
      description: >
        PATCH is restricted to a whitelist (title, description, RCA, EC criteria, product
        context, per-phase due dates, root-cause categories, originator + EC owner
        re-assignment). Lifecycle / signature columns (status, closedAt, gate signatures,
        effectiveness verification) must flow through dedicated workflow endpoints to
        preserve Part 11 controls. After Gate 1 approval the bundle becomes
        read-only — attempts to PATCH locked fields return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCapaBody"
      responses:
        "200":
          description: Updated CAPA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/advance:
    post:
      operationId: advanceCapaStatus
      tags: [capas]
      summary: (Legacy) advance the linear status one step
      description: >
        Original Session-1 linear status workflow. Coexists with the gated
        /advance-stage / gate1-approve / gate2-approve flow shipped in Session 4.
        New UI prefers /advance-stage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated CAPA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/advance-stage:
    post:
      operationId: advanceCapaStage
      tags: [capas]
      summary: Advance one stage in the planning or execution ramp
      description: >
        Only the non-gated transitions (Initiation→Investigation, Investigation→Action
        Planning, Action Planning→EC Planning, Action Execution→EC Execution). Gate
        transitions (EC Planning→Action Execution, EC Execution→Closed) use the gate
        endpoints below.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stage advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/gate0-approve:
    post:
      operationId: gate0ApproveCapa
      tags: [capas]
      summary: Sign Gate 0 (Manager/Quality acceptance, single approver)
      description: >
        Session 35 — Manager / Quality / Admin only (no Supervisors). Body
        { initials, signatureMeaning }. Stage must be Initiation. Originator
        cannot sign their own. On approval, the CAPA advances Initiation →
        Investigation and the six gate0_* fields are stamped. No reject
        endpoint by design — if the reviewer doesn't accept, they simply do
        not sign and the originator keeps editing in Initiation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gate0ApproveBody"
      responses:
        "200":
          description: Gate 0 acceptance recorded — CAPA advanced to Investigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"
        "401":
          description: Authentication required
        "403":
          description: Role not eligible (Manager / Quality / Admin required)
        "404":
          description: CAPA not found
        "409":
          description: Stage is not Initiation, or originator attempting to self-accept, or state changed during request

  /capas/{id}/gate1-approve:
    post:
      operationId: gate1ApproveCapa
      tags: [capas]
      summary: Sign Gate 1 (pre-implementation approval; two distinct approvers)
      description: >
        Body { initials, signatureMeaning }. Server chooses slot 1 or 2 based on
        current state; a single user cannot sign both slots; the originator
        cannot sign at all. After slot 2 signs, the CAPA advances to
        Action Execution and the problem-statement / RCA / action-plan / EC-plan
        bundle becomes immutable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gate1ApproveBody"
      responses:
        "200":
          description: Gate 1 sign-off recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/gate1-reject:
    post:
      operationId: gate1RejectCapa
      tags: [capas]
      summary: Reject Gate 1 (mandatory comment, rollback to Investigation or Planning)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gate1RejectBody"
      responses:
        "200":
          description: Rejected — CAPA returned to chosen stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/gate2-approve:
    post:
      operationId: gate2ApproveCapa
      tags: [capas]
      summary: Sign Gate 2 (closure outcome, Pass or Fail)
      description: >
        Pass closes the CAPA. Fail requires a comment and rollback target
        (Investigation or Planning) and re-opens the relevant stage.
        Approver cannot be the originator, EC Owner, or any action-item owner
        (Part 11 segregation of duties).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gate2ApproveBody"
      responses:
        "200":
          description: Gate 2 outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/verify-effectiveness:
    post:
      operationId: verifyCapaEffectiveness
      tags: [capas]
      summary: Sign the effectiveness check (Supervisor+)
      description: >
        One-time write. Approver-eligible role required; initials must match
        the user's own. Records the outcome and locks subsequent re-verification.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCapaEffectivenessBody"
      responses:
        "200":
          description: Effectiveness verification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  /capas/{id}/close:
    post:
      operationId: closeCapa
      tags: [capas]
      summary: Close a CAPA (Manager, Quality, or Admin only — Part 11)
      description: >
        Requires Manager, Quality, or Admin role. Effectiveness must be signed
        and every action item must be Verified before close is allowed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCapaBody"
      responses:
        "200":
          description: CAPA closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capa"

  # ── Effectiveness-check AI suggestions (spec'd Session 30) ────────────────
  # Generates AI-assisted effectiveness-check criteria suggestions based on
  # the CAPA's existing action items. The server reads action items directly
  # from the database (no body fields are required); the soft-fail response
  # is `{ suggestions: [] }` so the UI can degrade gracefully when the AI
  # backend is unavailable. Authentication is required.
  /capas/{id}/effectiveness-suggestions:
    post:
      operationId: suggestCapaEffectiveness
      tags: [capas]
      summary: Generate AI-suggested effectiveness-check criteria
      description: |
        Returns a list of suggested effectiveness-check criteria. The server
        reads the CAPA's existing action items from the database, so the
        request body is not required. On any backend failure the server
        soft-fails to `{ suggestions: [] }` rather than returning an error,
        so the caller does not need to special-case empty results.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggestion list (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaEffectivenessSuggestions"
        "401":
          description: Authentication required

  /capas/{id}/action-items:
    get:
      operationId: listCapaActionItemsForCapa
      tags: [capas]
      summary: List action items for a single CAPA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaActionItem"
    post:
      operationId: createCapaActionItem
      tags: [capas]
      summary: Add an action item to a CAPA
      description: >
        Adding the first action item auto-advances the CAPA from Action Planning
        to EC Planning (Session 12).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapaActionItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaActionItem"

  /capas/{id}/action-items/{itemId}:
    patch:
      operationId: updateCapaActionItem
      tags: [capas]
      summary: Update an action item (description, owner, due date, notes, or status to Completed)
      description: >
        Status can be set to Open, In Progress, or Completed. Verified requires
        the separate /verify endpoint (independent signer). When the status is set
        to Completed, the server stamps the actor as the completer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCapaActionItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaActionItem"
    delete:
      operationId: deleteCapaActionItem
      tags: [capas]
      summary: Delete an action item (only allowed before Verified)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /capas/{id}/action-items/{itemId}/verify:
    post:
      operationId: verifyCapaActionItem
      tags: [capas]
      summary: Independent verifier signs a Completed action item (Part 11)
      description: >
        Four-eyes rule — the verifier must not be the user who marked the item
        Completed. Approver-eligible role required; initials must match the
        signer's account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCapaActionItemBody"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaActionItem"

  # ─── CAPA ACTION ITEMS (Session 18 aggregate) ────────────────────────────────
  /capa-action-items:
    get:
      operationId: listCapaActionItems
      tags: [capas]
      summary: List CAPA action items across all CAPAs, optionally filtered by assignee
      description: >
        Aggregate endpoint used by the Dashboard My Queue and the CAPAs page
        ?queue=action_assignee filter. Avoids N+1 fetching of per-CAPA action
        items. The per-CAPA equivalents live at /capas/{id}/action-items but
        are not yet spec'd; this endpoint is the only one needed by the
        Dashboard slice.
      parameters:
        - name: assignedToName
          in: query
          required: false
          description: Exact-match filter on action item assignedToName
          schema:
            type: string
        - name: open
          in: query
          required: false
          description: Pass 1 or true to return only status=Open items (excludes Completed and Verified)
          schema:
            type: string
      responses:
        "200":
          description: List of CAPA action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaActionItem"

  # ─── PACKAGING DESIGN APPROVALS ──────────────────────────────────────────────
  /packaging-designs:
    get:
      operationId: listPackagingDesigns
      tags: [packaging]
      summary: List packaging design approvals
      responses:
        "200":
          description: Packaging designs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackagingDesign"
    post:
      operationId: createPackagingDesign
      tags: [packaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackagingDesignBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingDesign"

  /packaging-designs/{id}:
    get:
      operationId: getPackagingDesign
      tags: [packaging]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Packaging design
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingDesign"
    patch:
      operationId: updatePackagingDesign
      tags: [packaging]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePackagingDesignBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingDesign"

  /packaging-designs/{id}/approve:
    post:
      operationId: approvePackagingDesign
      tags: [packaging]
      summary: Approve packaging design (Part 11 signed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureBody"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagingDesign"

  # ─── AUDIT LOG ───────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [auditlog]
      summary: List audit log entries
      parameters:
        - name: tableName
          in: query
          required: false
          schema:
            type: string
        - name: rowId
          in: query
          required: false
          schema:
            type: integer
        - name: operation
          in: query
          required: false
          description: "INSERT | UPDATE | DELETE"
          schema:
            type: string
        - name: changedBy
          in: query
          required: false
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: ISO date string start of range
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: ISO date string end of range
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary counts
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/batch-status-breakdown:
    get:
      operationId: getBatchStatusBreakdown
      tags: [dashboard]
      summary: Batch records by status
      responses:
        "200":
          description: Batch status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent compliance activity feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity (audit log entries)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  /dashboard/open-items:
    get:
      operationId: getOpenItems
      tags: [dashboard]
      summary: Open NCs, complaints, and field actions requiring attention
      responses:
        "200":
          description: Open items requiring attention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenItemsDetail"

  /dashboard/testing-metrics:
    get:
      operationId: getDashboardTestingMetrics
      tags: [dashboard]
      summary: Operations testing-throughput aggregates (Session 37 — Tier 3 #15)
      description: >
        Aggregates batch_testing rows over a rolling window. Returns pass /
        fail / pending counts plus the average turnaround time (sample-pulled
        to result-received) for results that landed in the window. Pass and
        Fail counts honor `resultDate within window`; the pending count is
        unwindowed so operators see the full backlog. Avg turnaround prefers
        the Session 36 `samplePulledAt` field and falls back to the legacy
        `submittedDate` for pre-Session-36 rows.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 90
            minimum: 1
      responses:
        "200":
          description: Testing metrics for the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTestingMetrics"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SignatureBody:
      type: object
      properties:
        initials:
          type: string
        signatureMeaning:
          type: string
        userId:
          type: integer
      required:
        - initials
        - signatureMeaning
        - userId

    # ── Users ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: ["string", "null"]
        fullName:
          type: string
        email:
          type: string
        initials:
          type: string
        role:
          type: string
          description: "Admin | Manager | Supervisor | Quality | Operator"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - email
        - initials
        - role
        - active
        - createdAt

    CreateUserBody:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        initials:
          type: string
        role:
          type: string
        clerkUserId:
          type: ["string", "null"]
      required:
        - fullName
        - email
        - initials
        - role

    UpdateUserBody:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        initials:
          type: string
        role:
          type: string
        active:
          type: boolean

    # ── Company Profile ──────────────────────────────────────────────────────
    CompanyProfile:
      type: object
      properties:
        id:
          type: integer
        companyName:
          type: string
        licenseNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        timeZone:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyName
        - updatedAt

    UpdateCompanyProfileBody:
      type: object
      properties:
        companyName:
          type: string
        licenseNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        timeZone:
          type: ["string", "null"]

    # ── Regulatory Config ────────────────────────────────────────────────────
    RegulatoryConfig:
      type: object
      properties:
        id:
          type: integer
        state:
          type: string
        maxThcPerServing:
          type: number
        maxThcPerContainer:
          type: number
        potencyTolerancePct:
          type: number
        retentionYears:
          type: integer
        tracingSystem:
          type: ["string", "null"]
        additionalConfig:
          type: object
          additionalProperties: true
      required:
        - id
        - state
        - maxThcPerServing
        - maxThcPerContainer
        - potencyTolerancePct
        - retentionYears

    # ── Suppliers ────────────────────────────────────────────────────────────
    Supplier:
      type: object
      properties:
        id:
          type: integer
        supplierName:
          type: string
        contactPerson:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        supplierType:
          type: string
          description: "Cannabis Material | Packaging Material | Production Material | Testing Laboratory | Service Provider | Other"
        status:
          type: string
          description: "Approved | Pending Review | License Pending | Conditional | Disqualified | Suspended | Unapproved"
        qualityRating:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        requalificationIntervalYears:
          type: integer
          description: "How often this supplier must be re-qualified: 1, 2, 3, 4, or 5 years"
          default: 1
        lastQualifiedDate:
          type: ["string", "null"]
          format: date
          description: "Most recent approval date from an approved qualification record"
        nextReviewDue:
          type: ["string", "null"]
          format: date
          description: "Computed: lastQualifiedDate + requalificationIntervalYears"
        reviewStatus:
          type: ["string", "null"]
          description: "overdue | due-soon | current | never-qualified"
        riskScore:
          type: ["integer", "null"]
          description: "Computed risk score 0–100. Higher is riskier."
        riskTier:
          type: ["string", "null"]
          description: "Low | Medium | High | Critical"
        riskTierRationale:
          type: ["string", "null"]
          description: "Session 33 (Tier 2 #9) — operator's documented reason for the current Risk Tier. Required on every tier change."
        riskTierSetAt:
          type: ["string", "null"]
          format: date-time
          description: "Server-stamped time of the most recent Risk Tier assignment."
        riskTierSetByName:
          type: ["string", "null"]
          description: "Server-stamped full name of the user who set the current Risk Tier."
        riskFactors:
          type: array
          items:
            type: string
          nullable: true
          description: "Human-readable list of factors contributing to the risk score"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - supplierName
        - supplierType
        - status
        - requalificationIntervalYears
        - createdAt
        - updatedAt

    CreateSupplierBody:
      type: object
      properties:
        supplierName:
          type: string
        contactPerson:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        supplierType:
          type: string
        status:
          type: string
          description: "Approved | Pending Review | License Pending | Conditional | Disqualified | Suspended | Unapproved"
        qualityRating:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        riskTier:
          type: ["string", "null"]
          description: "Low | Medium | High | Critical"
        riskTierRationale:
          type: ["string", "null"]
          description: "Session 33 (Tier 2 #9) — required when riskTier is set."
      required:
        - supplierName
        - supplierType
        - status

    UpdateSupplierBody:
      type: object
      properties:
        supplierName:
          type: string
        contactPerson:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        supplierType:
          type: string
        status:
          type: string
          description: "Approved | Pending Review | License Pending | Conditional | Disqualified | Suspended | Unapproved"
        qualityRating:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        requalificationIntervalYears:
          type: integer
        riskTier:
          type: ["string", "null"]
          description: "Low | Medium | High | Critical"
        riskTierRationale:
          type: ["string", "null"]
          description: "Session 33 (Tier 2 #9) — required on every riskTier change."

    ReopenSupplierBody:
      type: object
      description: "Session 32 (Tier 1 #4) — reopen an Approved supplier for revision. The reason is recorded to the audit trail."
      properties:
        reason:
          type: string
          description: "Why the supplier is being reopened (free-text, required, audit-logged)."
      required:
        - reason

    SupplierRiskHistoryPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          description: "First day of the month (YYYY-MM-DD)"
        riskScore:
          type: integer
          description: "Computed risk score 0–100 at this point in time"
        riskTier:
          type: string
          description: "Low | Medium | High | Critical"
      required:
        - date
        - riskScore
        - riskTier

    SupplierAttachment:
      type: object
      properties:
        id:
          type: integer
        supplierId:
          type: integer
        fileType:
          type: string
          description: "COA | License | Certification | Insurance | SDS | Other"
        fileName:
          type: string
        filePath:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - supplierId
        - fileType
        - fileName
        - filePath
        - createdAt

    CreateSupplierAttachmentBody:
      type: object
      properties:
        fileType:
          type: string
        fileName:
          type: string
        filePath:
          type: string
        notes:
          type: ["string", "null"]
      required:
        - fileType
        - fileName
        - filePath

    # ── Incoming Inspections ─────────────────────────────────────────────────
    IncomingInspection:
      type: object
      properties:
        id:
          type: integer
        inspectionNumber:
          type: string
        supplierId:
          type: ["integer", "null"]
        supplierName:
          type: ["string", "null"]
        poManifestNumber:
          type: ["string", "null"]
        inspectionDate:
          type: string
          format: date
        inspectedBy:
          type: ["integer", "null"]
        inspectedByName:
          type: ["string", "null"]
        result:
          type: string
          description: "Pass | Fail | Conditional Pass"
        inspectionNotes:
          type: ["string", "null"]
        # ── Session 10 — Inspection State rework ─────────────────────────
        # Rationale required when Fail / Conditional is recorded, persisted
        # to a structured column with author + timestamp for audit.
        stateRationale:
          type: ["string", "null"]
        stateRationaleByName:
          type: ["string", "null"]
        stateRationaleAt:
          type: ["string", "null"]
          format: date-time
        # Supervisor+ Part 11 sign-off required when Pass is granted with
        # any failed line item.
        passApproverName:
          type: ["string", "null"]
        passApproverInitials:
          type: ["string", "null"]
        passApproverMeaning:
          type: ["string", "null"]
        passApprovedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - inspectionNumber
        - inspectionDate
        - result
        - createdAt
        - updatedAt

    CreateIncomingInspectionBody:
      type: object
      properties:
        supplierId:
          type: ["integer", "null"]
        poManifestNumber:
          type: ["string", "null"]
        inspectionDate:
          type: string
          format: date
        inspectedBy:
          type: ["integer", "null"]
        result:
          type: string
        inspectionNotes:
          type: ["string", "null"]
      required:
        - inspectionDate
        - result

    UpdateIncomingInspectionBody:
      type: object
      properties:
        supplierId:
          type: ["integer", "null"]
        poManifestNumber:
          type: ["string", "null"]
        inspectionDate:
          type: string
          format: date
        inspectedBy:
          type: ["integer", "null"]
        result:
          type: string
        inspectionNotes:
          type: ["string", "null"]
        # ── Session 10 additions on update ───────────────────────────────
        stateRationale:
          type: ["string", "null"]
        stateRationaleByName:
          type: ["string", "null"]
        stateRationaleAt:
          type: ["string", "null"]
          format: date-time
        passApproverName:
          type: ["string", "null"]
        passApproverInitials:
          type: ["string", "null"]
        passApproverMeaning:
          type: ["string", "null"]
        passApprovedAt:
          type: ["string", "null"]
          format: date-time

    # ── Inventory ────────────────────────────────────────────────────────────
    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        itemName:
          type: string
        itemType:
          type: string
          description: "Cannabis Material | Packaging | Production Material | Other"
        supplierId:
          type: ["integer", "null"]
        lotNumber:
          type: ["string", "null"]
        quantity:
          type: number
        unitOfMeasure:
