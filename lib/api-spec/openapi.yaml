    # CapaDashboardItem is the slim shape used by the /open-items dashboard
    # endpoint. Extended in Session 19 to surface Session 4/11/12 columns
    # the dashboard and CAPAs.tsx now consume (stage, originator, EC owner,
    # gate sign-offs). The full per-row shape is defined as Capa below.
    CapaDashboardItem:
      type: object
      properties:
        id:
          type: integer
        capaNumber:
          type: string
        type:
          type: string
        title:
          type: string
        status:
          type: string
        stage:
          type: ["string", "null"]
          description: "Initiation | Investigation | Action Planning | EC Planning | Action Execution | EC Execution | Closed"
        openedByName:
          type: ["string", "null"]
        originatorName:
          type: ["string", "null"]
        effectivenessOwnerName:
          type: ["string", "null"]
        effectivenessCheckDue:
          type: ["string", "null"]
        # Gate 1 (pre-implementation) sign-off snapshot — full history in audit_log.
        gate1Approver1Name:
          type: ["string", "null"]
        gate1Approver2Name:
          type: ["string", "null"]
        gate1ApprovedAt:
          type: ["string", "null"]
          format: date-time
        # Gate 2 (closure) sign-off snapshot.
        gate2ApproverName:
          type: ["string", "null"]
        gate2Outcome:
          type: ["string", "null"]
          description: "Pass | Fail"
        openActionItems:
          type: integer
        totalActionItems:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - capaNumber
        - type
        - title
        - status
        - openActionItems
        - totalActionItems
        - createdAt

    # Full Capa entity — the shape returned by GET /api/capas (not yet
    # individually spec'd in paths). Added Session 19 so detail-page consumers
    # can drop the structural-cast workarounds once codegen runs. The
    # corresponding endpoints are still hand-fetched until a future regen
    # pass adds them under paths.
    Capa:
      type: object
      properties:
        id:
          type: integer
        capaNumber:
          type: string
        type:
          type: string
          description: "Corrective | Preventive"
        title:
          type: string
        description:
          type: string
        sourceNcId:
          type: ["integer", "null"]
        sourceComplaintId:
          type: ["integer", "null"]
        # ── Session 35 — consolidated 6-stage CAPA workflow ──────────────
        # Initiation → [Gate 0] → Investigation → Planning → [Gate 1] →
        # Action Execution → EC Execution → [Gate 2] → Closed.
        stage:
          type: string
          description: "Initiation | Investigation | Planning | Action Execution | EC Execution | Closed"
        # Legacy linear status preserved for back-compat.
        status:
          type: string
        # ── Investigation / RCA ──────────────────────────────────────────
        rootCauseAnalysis:
          type: ["string", "null"]
        rcaMethod:
          type: ["string", "null"]
          description: "Legacy single-value RCA method; kept for back-compat. New code writes rcaMethods (array)."
        rcaMethods:
          type: ["array", "null"]
          items:
            type: string
        # ── Session 12: categorical root-cause multi-select ──────────────
        rootCauses:
          type: ["array", "null"]
          items:
            type: string
        # ── Effectiveness Check ──────────────────────────────────────────
        effectivenessCriteria:
          type: ["string", "null"]
        effectivenessCheckDue:
          type: ["string", "null"]
          format: date
        effectivenessVerifiedAt:
          type: ["string", "null"]
          format: date-time
        effectivenessVerifiedById:
          type: ["integer", "null"]
        effectivenessVerifiedByName:
          type: ["string", "null"]
        effectivenessVerifiedByInitials:
          type: ["string", "null"]
        effectivenessOutcome:
          type: ["string", "null"]
        effectivenessNotes:
          type: ["string", "null"]
        # ── Originator / EC Owner ────────────────────────────────────────
        originatorId:
          type: ["integer", "null"]
        originatorName:
          type: ["string", "null"]
        effectivenessOwnerId:
          type: ["integer", "null"]
        effectivenessOwnerName:
          type: ["string", "null"]
        # ── Session 35 — Gate 0 (Manager/Quality acceptance, single approver) ─
        # Stamps these six fields when a Manager/Quality/Admin accepts the
        # CAPA out of Initiation. Originator cannot self-accept. There is no
        # corresponding gate0-reject — declining = not signing.
        gate0ApproverId:
          type: ["integer", "null"]
        gate0ApproverName:
          type: ["string", "null"]
        gate0ApproverInitials:
          type: ["string", "null"]
        gate0ApproverAt:
          type: ["string", "null"]
          format: date-time
        gate0ApproverMeaning:
          type: ["string", "null"]
        gate0ApprovedAt:
          type: ["string", "null"]
          format: date-time
        # ── Gate 1 (two distinct approvers, Part 11) ─────────────────────
        gate1Approver1Id:
          type: ["integer", "null"]
        gate1Approver1Name:
          type: ["string", "null"]
        gate1Approver1Initials:
          type: ["string", "null"]
        gate1Approver1At:
          type: ["string", "null"]
          format: date-time
        gate1Approver1Meaning:
          type: ["string", "null"]
        gate1Approver2Id:
          type: ["integer", "null"]
        gate1Approver2Name:
          type: ["string", "null"]
        gate1Approver2Initials:
          type: ["string", "null"]
        gate1Approver2At:
          type: ["string", "null"]
          format: date-time
        gate1Approver2Meaning:
          type: ["string", "null"]
        gate1ApprovedAt:
          type: ["string", "null"]
          format: date-time
        # ── Gate 2 (single approver, Pass/Fail) ──────────────────────────
        gate2ApproverId:
          type: ["integer", "null"]
        gate2ApproverName:
          type: ["string", "null"]
        gate2ApproverInitials:
          type: ["string", "null"]
        gate2ApproverAt:
          type: ["string", "null"]
          format: date-time
        gate2ApproverMeaning:
          type: ["string", "null"]
        gate2Outcome:
          type: ["string", "null"]
        # ── Latest rejection snapshot (full history in audit_log) ────────
        lastRejectionAt:
          type: ["string", "null"]
          format: date-time
        lastRejectionStage:
          type: ["string", "null"]
          description: "Gate 1 | Gate 2"
        lastRejectionById:
          type: ["integer", "null"]
        lastRejectionByName:
          type: ["string", "null"]
        lastRejectionComment:
          type: ["string", "null"]
        lastRejectionTarget:
          type: ["string", "null"]
          description: "Investigation | Action Planning"
        # ── Open / close audit ────────────────────────────────────────────
        openedById:
          type: ["integer", "null"]
        openedByName:
          type: ["string", "null"]
        closedById:
          type: ["integer", "null"]
        closedByName:
          type: ["string", "null"]
        closedByInitials:
          type: ["string", "null"]
        closureNotes:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        # ── Session 12: product context ──────────────────────────────────
        productType:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]
        lotNumber:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        # ── Session 12: per-phase due dates ──────────────────────────────
        # Session 34 (Tier 2 #11) — these now auto-stamp on phase entry.
        # investigationDueDate defaults to createdAt+30d at open; the other
        # two stamp +15d on the Investigation→Action Planning and
        # Action Planning→EC Planning transitions respectively.
        investigationDueDate:
          type: ["string", "null"]
          format: date
        actionPlanningDueDate:
          type: ["string", "null"]
          format: date
        ecPlanningDueDate:
          type: ["string", "null"]
          format: date
        # ── Session 34 (Tier 2 #10) — initial Risk classification ───────
        # Required at CAPA open (Critical | High | Medium | Low) with a
        # documented rationale. Can be revised during Investigation; every
        # revision writes a RISK_REVISED audit_log entry. The four
        # riskRevised* columns mirror the most recent revision for
        # at-a-glance display; full history lives in audit_log.
        riskLevel:
          type: ["string", "null"]
          description: "Critical | High | Medium | Low"
        riskRationale:
          type: ["string", "null"]
          description: "Operator's documented reason for the current Risk Level. Required when riskLevel is set."
        riskReleased:
          type: ["boolean", "null"]
          description: "Guiding prompt: was the affected lot released to customers?"
        riskCustomerAffected:
          type: ["boolean", "null"]
          description: "Guiding prompt: has a customer been impacted?"
        riskLabelingImpact:
          type: ["boolean", "null"]
          description: "Guiding prompt: is product labeling implicated?"
        riskInHouseOnly:
          type: ["boolean", "null"]
          description: "Guiding prompt: confined to internal use, no external exposure?"
        riskPreBulk:
          type: ["boolean", "null"]
          description: "Guiding prompt: caught pre-bulk, before material was committed?"
        riskRevisedAt:
          type: ["string", "null"]
          format: date-time
          description: "Server-stamped time of the most recent Risk revision."
        riskRevisedByName:
          type: ["string", "null"]
          description: "Server-stamped full name of the user who last revised Risk."
        riskRevisedReason:
          type: ["string", "null"]
          description: "Reason supplied with the most recent Risk revision."
        riskRevisedFrom:
          type: ["string", "null"]
          description: "Previous Risk Level captured on the most recent revision."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - capaNumber
        - type
        - title
        - description
        - stage
        - status
        - createdAt
        - updatedAt

    # ── CAPA Action Item (Session 4 + Session 18 aggregate endpoint) ─────
    CapaActionItem:
