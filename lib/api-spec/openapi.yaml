  # ─── NC CORRECTIONS (Session 11 task model; spec'd Session 25) ───────────────
  # Containment / correction tasks taken in response to a non-conformance.
  # Distinct from CorrectiveAction above (the legacy NC-side corrective-action
  # log) and from CAPA action items (which are root-cause-driven preventive
  # actions). The lifecycle: an NC originator opens a correction task with
  # description, due date, and a task owner; only the assigned owner OR a
  # Supervisor+ approver may later mark it complete. Once completed the row
  # is immutable (Part 11 traceability). Legacy `performedBy*` / `notes` /
  # `performedAt` columns remain on rows created before Session 11; new UI
  # does not surface them.
  /non-conformances/{id}/corrections:
    get:
      operationId: listNcCorrections
      tags: [nonconformances]
      summary: List correction tasks for a non-conformance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: NC correction tasks (ordered by performedAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NcCorrection"
    post:
      operationId: createNcCorrection
      tags: [nonconformances]
      summary: Open a correction task on a non-conformance
      description: |
        Creates a new correction task. The acting user is recorded in the
        legacy `performedBy*` columns for audit continuity. The new task
        starts with `completed: false`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNcCorrectionBody"
      responses:
        "201":
          description: Correction task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcCorrection"
        "400":
          description: Task description is required

  /nc-corrections/{id}:
    patch:
      operationId: updateNcCorrection
      tags: [nonconformances]
      summary: Edit a correction task (only while open)
      description: |
        Updates a not-yet-completed correction task. Completed tasks are
        immutable per 21 CFR Part 11 — the server returns 409 if the
        correction is already marked complete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNcCorrectionBody"
      responses:
        "200":
          description: Updated correction task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcCorrection"
        "400":
          description: No editable fields provided
        "404":
          description: Correction task not found
        "409":
          description: Completed correction tasks are immutable

  /nc-corrections/{id}/complete:
    post:
      operationId: completeNcCorrection
      tags: [nonconformances]
      summary: Mark a correction task complete
      description: |
        Marks the correction task complete and records `completedAt`,
        `completedByUserId`, and `completedByName` from the signed-in user.
        Authorization: the actor must be either the assigned task owner
        (matched by `taskOwnerUserId` or case-insensitive `taskOwnerName`)
        OR hold a Supervisor / Manager / Quality / Admin role. Idempotent:
        if the task is already completed the existing row is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed correction task (or existing if already complete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcCorrection"
        "401":
          description: Authentication required
        "403":
          description: Only the assigned task owner or a Supervisor+ approver may complete
        "404":
          description: Correction task not found

