    DashboardTestingMetrics:
      type: object
      properties:
        windowDays:
          type: integer
          description: "Window size used for pass/fail/turnaround. Defaults to 90 server-side."
        passCount:
          type: integer
          description: "batch_testing rows with testResult='Pass' and resultDate within the window."
        failCount:
          type: integer
          description: "batch_testing rows with testResult='Fail' and resultDate within the window."
        pendingCount:
          type: integer
          description: "batch_testing rows still in testResult='Pending'. Unwindowed — operators want the full backlog."
        avgTurnaroundDays:
