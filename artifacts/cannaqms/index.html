<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CannaQ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cannaqms-theme');
          document.documentElement.classList.toggle('dark', t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
          document.documentElement.dataset.density = localStorage.getItem('cannaqms-density') || 'comfortable';
          document.documentElement.dataset.workspaceMode = localStorage.getItem('cannaqms-workspace-mode') || 'guided';
        } catch (e) { /* Daylight is the default. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
