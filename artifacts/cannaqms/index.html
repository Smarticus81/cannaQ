<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>CannaQ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Theme bootstrap. Runs before paint (no flash) and honors the saved
         choice. DEFAULTS TO DARK (verified via live QA 2026-08-12); users who
         pick light via the top-bar toggle are remembered. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cannaqms-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
